PACKAGE_NAME="fl2000"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="fl2000"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make KVER=${kernelver} clean"
AUTOINSTALL="yes"
# Note: the Makefile also builds it66121.ko (HDMI-bridge). We deliberately do
# NOT list it here, so DKMS installs only fl2000.ko. On recent kernels (6.15+/7.x)
# it66121_probe() oopses; the VGA path (vga_mode=1) does not need it. See README.
